name: Build Sirinarity Kernel

on:
  workflow_dispatch:

env:
  # === Настройки компиляции ===
  KERNEL_ARCH: arm64
  DEFCONFIG_FILE: "lavender-perf_defconfig"
  OUT_DIR: out
  
  # === Компилятор: Proton Clang (Гибридная сборка) ===
  CLANG_REPO: https://github.com/kdrag0n/proton-clang.git
  CLANG_DIR: toolchain
  
  # === Кросс-компиляторы (System GNU GCC) ===
  COMPILER_64: aarch64-linux-gnu-
  COMPILER_32: arm-linux-gnueabi-
  
  # === Флаги хост-компилятора и LLVM (Без LLVM_IAS для поддержки легаси) ===
  HOST_COMPILER_FLAGS: "-fcommon"
  LLVM_FLAGS: "LLVM=1 HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTLD=ld.lld HOSTAR=llvm-ar"
  
  # === Целевое устройство ===
  DEVICE_CODENAME: lavender
  
  # === Пути к исходным и промежуточным файлам ===
  IMAGE_PATH: out/arch/arm64/boot/Image.gz-dtb
  
  # === Имена выходных артефактов ===
  ARTIFACT_RAW: Sirinarity-Raw.gz-dtb
  ARTIFACT_AK3: Sirinarity-AK3.zip
  ARTIFACT_BOOT: Sirinarity-boot.img
  
  # === Ресурсы для перепаковки (Format 3) ===
  BOOT_ARCHIVE_PATH: .github/templates/boot.zip
  MAGISKBOOT_PATH: .github/tools/magiskboot
  
  # === Внешние репозитории ===
  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build_core:
    name: Build Core
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: blxizy/kernel_xiaomi_lavender
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
          fetch-depth: 1

      - name: Install Base Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 ${{ env.CLANG_REPO }} ${{ env.CLANG_DIR }}
          # Удаляем встроенные симлинки LLVM, чтобы исключить конфликты с ассемблером
          rm -f ${{ env.CLANG_DIR }}/bin/aarch64-linux-gnu-*
          rm -f ${{ env.CLANG_DIR }}/bin/arm-linux-gnueabi-*
          rm -f ${{ env.CLANG_DIR }}/bin/as
          rm -f ${{ env.CLANG_DIR }}/bin/ld

      - name: Patch Kernel Makefile
        run: |
          # Исправляем несовместимость линковщика LLD с легаси-флагами в vDSO
          sed -i 's/aarch64linux/aarch64elf/g' arch/arm64/kernel/vdso/Makefile
          [ -f arch/arm64/kernel/vdso32/Makefile ] && sed -i 's/armelf_linux_eabi/armelf/g' arch/arm64/kernel/vdso32/Makefile || true

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/${{ env.CLANG_DIR }}/bin:$PATH"
          
          # Используем переменные CLANG_TRIPLE, чтобы ядро само переключало таргеты между 64-bit и 32-bit (vDSO)
          make O=${{ env.OUT_DIR }} ARCH=${{ env.KERNEL_ARCH }} CC="clang" CLANG_TRIPLE=${{ env.COMPILER_64 }} CLANG_TRIPLE_ARM32=${{ env.COMPILER_32 }} CROSS_COMPILE=${{ env.COMPILER_64 }} CROSS_COMPILE_ARM32=${{ env.COMPILER_32 }} ${{ env.LLVM_FLAGS }} ${{ env.DEFCONFIG_FILE }} HOSTCFLAGS="${{ env.HOST_COMPILER_FLAGS }}"
          
          make -j$(nproc) O=${{ env.OUT_DIR }} ARCH=${{ env.KERNEL_ARCH }} CC="clang" CLANG_TRIPLE=${{ env.COMPILER_64 }} CLANG_TRIPLE_ARM32=${{ env.COMPILER_32 }} CROSS_COMPILE=${{ env.COMPILER_64 }} CROSS_COMPILE_ARM32=${{ env.COMPILER_32 }} ${{ env.LLVM_FLAGS }} HOSTCFLAGS="${{ env.HOST_COMPILER_FLAGS }}"

      - name: Package Format 1 (Raw Kernel)
        run: |
          cp ${{ env.IMAGE_PATH }} ${{ env.ARTIFACT_RAW }}

      - name: Package Format 2 (AnyKernel3)
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL3_REPO }} AK3
          cp ${{ env.ARTIFACT_RAW }} AK3/Image.gz-dtb
          
          cd AK3
          sed -i "s/maguro/${{ env.DEVICE_CODENAME }}/g" anykernel.sh
          sed -i 's/block=.*boot/block=auto/g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' anykernel.sh
          zip -r9 ../${{ env.ARTIFACT_AK3 }} *
          cd ..

      - name: Package Format 3 (Repack boot.img)
        run: |
          if [ -f "${{ env.BOOT_ARCHIVE_PATH }}" ]; then
            unzip -q ${{ env.BOOT_ARCHIVE_PATH }} -d .
            cp ${{ env.MAGISKBOOT_PATH }} magiskboot
            chmod +x magiskboot
            ./magiskboot unpack boot.img
            cp ${{ env.ARTIFACT_RAW }} kernel
            ./magiskboot repack boot.img ${{ env.ARTIFACT_BOOT }}
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sirinarity-Release
          path: |
            ${{ env.ARTIFACT_RAW }}
            ${{ env.ARTIFACT_AK3 }}
            ${{ env.ARTIFACT_BOOT }}
