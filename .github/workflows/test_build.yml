name: Refactored Kernel Build Test

on:
  workflow_dispatch:

env:
  KERNEL_ARCH: arm64
  DEVICE_CODENAME: lavender
  DEFCONFIG_FILE: "lavender-perf_defconfig"
  OUT_DIR: out
  
  # Компилятор
  CLANG_REPO: https://github.com/kdrag0n/proton-clang.git
  CLANG_DIR: toolchain
  
  # GNU Кросс-компиляторы для линковки
  COMPILER_64: aarch64-linux-gnu-
  COMPILER_32: arm-linux-gnueabi-
  
  # Пути и репозитории
  IMAGE_PATH: out/arch/arm64/boot/Image.gz-dtb
  ARTIFACT_AK3: Sirinarity-AK3.zip
  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build_core:
    name: Build & Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 ${{ env.CLANG_REPO }} ${{ env.CLANG_DIR }}

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/${{ env.CLANG_DIR }}/bin:$PATH"
          
          # 1. Генерируем конфигурацию (тихий режим)
          make -s O=${{ env.OUT_DIR }} ARCH=${{ env.KERNEL_ARCH }} \
            CC="clang-wrapper" CROSS_COMPILE=${{ env.COMPILER_64 }} CROSS_COMPILE_ARM32=${{ env.COMPILER_32 }} \
            LLVM=1 LLVM_IAS=0 HOSTCC=clang HOSTCXX=clang++ AR=llvm-ar NM=llvm-nm HOSTAR=llvm-ar \
            HOSTCFLAGS="-fcommon" \
            ${{ env.DEFCONFIG_FILE }}
          
          # 2. Основная сборка
          make -j$(nproc) O=${{ env.OUT_DIR }} ARCH=${{ env.KERNEL_ARCH }} \
            CC="clang-wrapper" CROSS_COMPILE=${{ env.COMPILER_64 }} CROSS_COMPILE_ARM32=${{ env.COMPILER_32 }} \
            LLVM=1 LLVM_IAS=0 HOSTCC=clang HOSTCXX=clang++ AR=llvm-ar NM=llvm-nm HOSTAR=llvm-ar \
            HOSTCFLAGS="-fcommon"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL3_REPO }} AK3
          cp ${{ env.IMAGE_PATH }} AK3/Image.gz-dtb
          
          cd AK3
          sed -i "s/maguro/${{ env.DEVICE_CODENAME }}/g" anykernel.sh
          sed -i 's/block=.*boot/block=auto/g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' anykernel.sh
          zip -r9 ../${{ env.ARTIFACT_AK3 }} *
          cd ..

      - name: Upload Raw Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: ${{ env.IMAGE_PATH }}

      - name: Upload AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: Sirinarity-AK3
          path: ${{ env.ARTIFACT_AK3 }}
