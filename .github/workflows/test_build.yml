name: Sirinarity Kernel Release Build

on:
  workflow_dispatch:

env:
  # Основные параметры
  ARCH: arm64
  DEFCONFIG: lavender-perf_defconfig
  OUT_DIR: out
  
  # Инструментарий
  CLANG_URL: https://github.com/kdrag0n/proton-clang.git
  CLANG_DIR: toolchain
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  
  # Артефакты
  IMAGE: out/arch/arm64/boot/Image.gz-dtb
  RELEASE_ZIP: Sirinarity-AK3.zip

jobs:
  build_release:
    name: Compile & Package
    runs-on: ubuntu-22.04
    timeout-minutes: 60 # Защита от бесконечного зависания воркера

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0 # Полная история для надежного применения патчей

      - name: ⚙️ Prepare Build Environment
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 🛠️ Fetch Proton Clang Toolchain
        run: git clone --depth=1 ${{ env.CLANG_URL }} ${{ env.CLANG_DIR }}

      - name: 🩹 Apply Kernel Patches
        run: |
          echo "Applying 01-kernel-name.patch..."
          git apply .github/patches/01-kernel-name.patch

      - name: 🔨 Compile Kernel
        run: |
          chmod +x .github/scripts/clang-wrapper.sh
          
          export PATH="$GITHUB_WORKSPACE/${{ env.CLANG_DIR }}/bin:$PATH"
          export CC="$GITHUB_WORKSPACE/.github/scripts/clang-wrapper.sh"
          
          # Упаковываем все флаги компилятора в Bash-массив (принцип DRY)
          MAKE_ARGS=(
            O=${{ env.OUT_DIR }}
            ARCH=${{ env.ARCH }}
            CC="$CC"
            CROSS_COMPILE=${{ env.CROSS_COMPILE }}
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }}
            LLVM=1
            LLVM_IAS=0
            HOSTCC=clang
            HOSTCXX=clang++
            AR=llvm-ar
            NM=llvm-nm
            HOSTAR=llvm-ar
            HOSTCFLAGS="-fcommon"
          )
          
          echo "--- Generating Defconfig ---"
          make -s "${MAKE_ARGS[@]}" ${{ env.DEFCONFIG }}
          
          echo "--- Starting Main Build ---"
          make -j$(nproc) "${MAKE_ARGS[@]}"

      - name: 📦 Package AnyKernel3 Release
        run: |
          mkdir release_workspace
          unzip -q .github/templates/AnyKernel3.zip -d release_workspace
          cp ${{ env.IMAGE }} release_workspace/
          
          cd release_workspace
          zip -r9 ../${{ env.RELEASE_ZIP }} *
          cd ..

      - name: 💾 Upload Raw Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: ${{ env.IMAGE }}
          retention-days: 14

      - name: 🚀 Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Sirinarity-Kernel-Release
          path: ${{ env.RELEASE_ZIP }}
          retention-days: 14
